name: Environment and RTL checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bash scripts/bootstrap_ubuntu.sh
      - name: Compile, simulate, synthesize
        run: make check
